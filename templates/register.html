<!DOCTYPE html>
<html>
<head>
    <title>Register - Online Voting System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            margin-left: 25px;
            margin-top: 15px;
            font-size: 14px;
        }

        input {
            width: 85%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            padding: 12px 35px;
            margin-top: 25px;
            border: none;
            border-radius: 5px;
            background: #27ae60;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #219150;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: blue;
            text-decoration: underline;
        }

        .error {
            color: red;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🗳️ ONLINE VOTING SYSTEM</h1>
</div>

<div class="container">

    <h2>Register</h2>

    <form method="POST" action="/register">

        <label>Name:</label>
        <input type="text" name="name" required>

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Password:</label>
        <input type="password" name="password" required>

        <br>

        <button type="submit">Register</button>

    </form>

    {% if register_error %}
        <p class="error">{{ register_error }}</p>
    {% endif %}

    <a class="back" href="/">Back to Login</a>

</div>

</body>
</html>
