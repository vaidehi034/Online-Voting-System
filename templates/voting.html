<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voting | Online Voting System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #172554;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.12);
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            color: #172554;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .title p {
            color: #6b7280;
        }

        .warning {
            background: #fff7ed;
            color: #c2410c;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .candidates {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .candidate {
            background: white;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .candidate:hover {
            transform: translateY(-4px);
            border-color: #2563eb;
        }

        .candidate input {
            display: none;
        }

        .candidate label {
            cursor: pointer;
            display: block;
        }

        .candidate-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .candidate-name {
            font-size: 20px;
            font-weight: bold;
            color: #172554;
            margin-bottom: 8px;
        }

        .party {
            color: #6b7280;
            margin-bottom: 15px;
        }

        .select-text {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 20px;
            background: #eff6ff;
            color: #2563eb;
            font-weight: bold;
            font-size: 14px;
        }

        .candidate input:checked + label .select-text {
            background: #2563eb;
            color: white;
        }

        .candidate input:checked + label {
            border-radius: 12px;
        }

        .submit-area {
            text-align: center;
            margin-top: 35px;
        }

        .submit-btn {
            border: none;
            background: #16a34a;
            color: white;
            padding: 15px 45px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #15803d;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        @media (max-width: 800px) {
            .candidates {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo">
        🗳️ ONLINE VOTING SYSTEM
    </div>

    <a href="/dashboard" class="back">
        ← Dashboard
    </a>

</header>


<main class="container">

    <div class="title">

        <h1>Cast Your Vote</h1>

        <p>
            Select one candidate and submit your vote.
        </p>

    </div>


    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}


    {% if has_voted %}

        <div class="warning">
            ✅ You have already voted. You cannot vote again.
        </div>

    {% else %}

        <form method="POST" action="/voting">

            <div class="candidates">

                {% for candidate in candidates %}

                    <div class="candidate">

                        <input
                            type="radio"
                            name="candidate_id"
                            value="{{ candidate[0] }}"
                            id="candidate{{ candidate[0] }}"
                            required
                        >

                        <label for="candidate{{ candidate[0] }}">

                            <div class="candidate-icon">
                                👤
                            </div>

                            <div class="candidate-name">
                                {{ candidate[1] }}
                            </div>

                            <div class="party">
                                {{ candidate[2] }}
                            </div>

                            <span class="select-text">
                                Select Candidate
                            </span>

                        </label>

                    </div>

                {% endfor %}

            </div>


            <div class="submit-area">

                <button type="submit" class="submit-btn">
                    🗳️ Submit Vote
                </button>

            </div>

        </form>

    {% endif %}

</main>

</body>
</html>
